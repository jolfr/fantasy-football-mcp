[project]
name = "fantasy-mcp"
version = "0.2.0"
description = "MCP server exposing ESPN fantasy football team data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp[apps]>=4.0.3",
    "httpx>=0.28.1",
    "prefab-ui==0.20.2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
fantasy-mcp = "fantasy_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
